[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modpack-doctor"
version = "1.0.0"
description = "Comprehensive Minecraft Modpack & Dependency Diagnostic CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Modpack Doctor Contributors" }
]
keywords = [
    "minecraft",
    "modpack",
    "diagnostics",
    "fabric",
    "forge",
    "neoforge",
    "quilt",
    "dependencies",
    "mixin"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
modpack-doctor = "modpack_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["modpack_doctor*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=modpack_doctor --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
source = ["modpack_doctor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
